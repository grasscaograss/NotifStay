name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Set up Android SDK
        continue-on-error: true
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(find "$SDK" -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SM" ]; then echo "sdkmanager not found"; exit 1; fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-37" "build-tools;37.0.0"

      - name: Prepare signing keystore (if secrets configured)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            test -s release.jks || { echo "KEYSTORE_BASE64 invalid or empty"; exit 1; }
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS_PASS" "$KS_ALIAS" "$KS_KEY_PASS" > keystore.properties
            echo "keystore prepared"
          else
            echo "No signing secrets configured, building unsigned APK"
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon --console=plain assembleRelease

      - name: Collect SDK diagnostics
        if: always()
        run: |
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls -1 /usr/local/lib/android/sdk 2>&1 || true
            echo "--- platforms ---"
            ls -1 /usr/local/lib/android/sdk/platforms 2>&1 || true
            echo "--- build-tools ---"
            ls -1 /usr/local/lib/android/sdk/build-tools 2>&1 || true
            echo "--- sdkmanager ---"
            find /usr/local/lib/android/sdk -maxdepth 4 -name sdkmanager 2>/dev/null || true
          } > sdk-diagnostics.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-diagnostics
          path: sdk-diagnostics.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotifStay-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
